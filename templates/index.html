<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Taller Mecánico - Solicitud de Cotización</title>

    <!-- Hoja de estilos CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">

</head>


<body>


    <!-- =====================================================
         ENCABEZADO
         ===================================================== -->

    <header class="encabezado">

        <h1>Taller Mecánico</h1>

        <p>
            Servicio, mantenimiento y diagnóstico automotriz
        </p>

    </header>



    <!-- =====================================================
         CONTENIDO PRINCIPAL
         ===================================================== -->

    <main class="contenedor">

        <h2>Solicitud de Cotización</h2>


        <!-- =================================================
             FORMULARIO
             ================================================= -->

        <form action="{{ url_for('solicitar_cotizacion') }}"
              method="POST">


            <!-- =============================================
                 DATOS DEL PROSPECTO
                 ============================================= -->

            <fieldset>

                <legend>Datos del prospecto</legend>


                <label for="nombre">
                    Nombre:
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Escriba su nombre"
                    required>


                <label for="apellido_paterno">
                    Apellido paterno:
                </label>

                <input
                    type="text"
                    id="apellido_paterno"
                    name="apellido_paterno"
                    placeholder="Apellido paterno"
                    required>


                <label for="apellido_materno">
                    Apellido materno:
                </label>

                <input
                    type="text"
                    id="apellido_materno"
                    name="apellido_materno"
                    placeholder="Apellido materno">


                <label for="correo">
                    Correo electrónico:
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required>


                <label for="telefono">
                    Teléfono:
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="6181234567"
                    required>


            </fieldset>



            <!-- =============================================
                 DATOS DEL VEHÍCULO
                 ============================================= -->

            <fieldset>

                <legend>Datos del vehículo</legend>


                <label for="marca">
                    Marca:
                </label>

                <input
                    type="text"
                    id="marca"
                    name="marca"
                    placeholder="Ejemplo: Nissan"
                    required>


                <label for="modelo">
                    Modelo:
                </label>

                <input
                    type="text"
                    id="modelo"
                    name="modelo"
                    placeholder="Ejemplo: Sentra"
                    required>


                <label for="anio">
                    Año:
                </label>

                <input
                    type="number"
                    id="anio"
                    name="anio"
                    min="1950"
                    max="2030"
                    placeholder="2022"
                    required>


                <label for="kilometraje">
                    Kilometraje:
                </label>

                <input
                    type="number"
                    id="kilometraje"
                    name="kilometraje"
                    min="0"
                    placeholder="Ejemplo: 45000">


            </fieldset>



            <!-- =============================================
                 SERVICIO SOLICITADO
                 ============================================= -->

            <fieldset>

                <legend>Servicio solicitado</legend>


                <label for="id_servicio">
                    Seleccione el servicio:
                </label>


                <!--
                    Los servicios provienen de PostgreSQL.

                    servicio[0] = id_servicio
                    servicio[1] = nombre
                    servicio[2] = descripcion
                    servicio[3] = precio_base
                -->

                <select
                    id="id_servicio"
                    name="id_servicio"
                    required>


                    <option value="">
                        Seleccione un servicio
                    </option>


                    {% for servicio in servicios %}

                        <option value="{{ servicio[0] }}">

                            {{ servicio[1] }}
                            -
                            ${{ servicio[3] }}

                        </option>

                    {% endfor %}


                </select>



                <label for="descripcion_problema">
                    Describa el problema del vehículo:
                </label>


                <textarea
                    id="descripcion_problema"
                    name="descripcion_problema"
                    rows="5"
                    placeholder="Describa brevemente el problema que presenta el vehículo..."
                    required></textarea>


            </fieldset>



            <!-- =============================================
                 BOTÓN
                 ============================================= -->

            <div class="area-boton">

                <button type="submit">

                    Solicitar cotización

                </button>

            </div>


        </form>


    </main>



    <!-- =====================================================
         PIE DE PÁGINA
         ===================================================== -->

    <footer class="pie">

        Taller Mecánico |
        Sistema Web de Solicitudes de Servicio

    </footer>


</body>

</html>
